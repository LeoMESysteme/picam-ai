name: Playwright Tests
# Forgejo nutzt den vorhandenen Host-Runner auf dem Pi. Browserbibliotheken
# kommen aus dem System; dieser Job installiert keine Systempakete.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 20
    runs-on: picam-docs
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: /var/lib/forgejo-runner/playwright-browsers
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Install Playwright Browsers
      run: npx playwright install --only-shell chromium
    - name: Doku-Werkzeuge installieren
      run: |
        python3 -m venv .venv-docs
        .venv-docs/bin/pip install -r requirements-docs.txt
    - name: Interaktive Doku prüfen
      run: |
        ./scripts/docs-site.sh build -s
        npx playwright test -c playwright.docs.config.ts --workers=1 --reporter=html
    # Werkbank /live gegen den Fake-Server (tests/live_ui_server.py, Port 8767;
    # die Doku-Prüfung nutzt 8766). Ohne Kamera und seriellen Port; Python-Pakete
    # (aiohttp, OpenCV, NumPy) kommen aus dem System, daher --system-site-packages.
    - name: Python-Umgebung für die Werkbank
      run: python3 -m venv --system-site-packages .venv
    - name: Werkbank-Oberfläche prüfen
      run: npx playwright test -c playwright.live.config.ts --workers=1 --reporter=html --output=test-results-live
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-live
    - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-live
        path: playwright-report-live/
        retention-days: 30
