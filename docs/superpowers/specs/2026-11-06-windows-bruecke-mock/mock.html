<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSVmulti-Brücke Mock</title>
<style>
/* ===== Tokens (Windows 11 Fluent, hell/dunkel) ===== */
:root{
  --mica:#f3f3f3; --mica2:#ededed; --card:#fbfbfb; --stroke:#e5e5e5; --stroke-strong:#8a8a8a;
  --text:#1a1a1a; --text2:#5d5d5d; --text-dis:#9a9a9a;
  --ctrl:#fdfdfd; --ctrl-hover:#f6f6f6; --ctrl-press:#efefef; --ctrl-stroke:#d1d1d1;
  --accent:#005fb8; --accent-hover:#196ebd; --accent-press:#3a82c5; --on-accent:#ffffff;
  --ok:#0f7b0f; --warn:#9d5d00; --err:#c42b1c; --info:#5d5d5d; --glyph:#ffffff;
  --bar-ok:#dff6dd; --bar-warn:#fff4ce; --bar-err:#fde7e9; --bar-info:#f9f9f9;
  --focus-outer:#1a1a1a; --focus-inner:#ffffff;
  --scrim:rgba(0,0,0,.30); --shadow-win:0 12px 32px rgba(0,0,0,.22), 0 0 2px rgba(0,0,0,.28);
  --shadow-fly:0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.2);
  --close-hover:#c42b1c;
  /* Mock-Rahmen (nicht Teil der App) */
  --desk:#dcdcdc; --panel:#ffffff; --panel-line:#b9b9b9; --panel-text:#202020;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
:root[data-theme="dark"]{
  --mica:#202020; --mica2:#1b1b1b; --card:#2b2b2b; --stroke:#3a3a3a; --stroke-strong:#9a9a9a;
  --text:#ffffff; --text2:#cfcfcf; --text-dis:#7a7a7a;
  --ctrl:#323232; --ctrl-hover:#3a3a3a; --ctrl-press:#292929; --ctrl-stroke:#464646;
  --accent:#60cdff; --accent-hover:#52b7e6; --accent-press:#44a0cc; --on-accent:#000000;
  --ok:#6ccb5f; --warn:#fce100; --err:#ff99a4; --info:#cfcfcf; --glyph:#1a1a1a;
  --bar-ok:#393d1b; --bar-warn:#433519; --bar-err:#442726; --bar-info:#2f2f2f;
  --focus-outer:#ffffff; --focus-inner:#1a1a1a;
  --scrim:rgba(0,0,0,.50); --shadow-win:0 12px 32px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.6);
  --shadow-fly:0 8px 16px rgba(0,0,0,.5), 0 0 2px rgba(0,0,0,.6);
  --desk:#0f0f0f; --panel:#181818; --panel-line:#5a5a5a; --panel-text:#ececec;
}
*{box-sizing:border-box}
html{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--desk);color:var(--panel-text);font:14px/20px var(--font);min-height:100vh}
::selection{background:var(--accent);color:var(--on-accent)}
input,textarea{caret-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Mock-Rahmen ===== */
.mock{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
.ctl{background:var(--panel);border-right:2px dashed var(--panel-line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:thin}
.ctl h2{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;font-family:var(--mono)}
.ctl .hint{font-size:12px;line-height:16px;margin:0 0 12px;opacity:.85}
.ctl h3{font-size:12px;line-height:16px;margin:16px 0 4px;font-weight:600}
.ctl .row{display:flex;gap:4px;flex-wrap:wrap}
.ctl button,.ctl label.chk{font:inherit;font-size:12px;line-height:16px}
.ctl .pick{display:grid;grid-template-columns:64px 1fr;width:100%;text-align:left;padding:4px 8px;border:1px solid transparent;border-radius:4px;background:none;color:inherit;cursor:pointer}
.ctl .pick:hover{background:rgba(127,127,127,.15)}
.ctl .pick[aria-current="true"]{border-color:var(--panel-text);font-weight:700}
.ctl .pick .id{display:block;font-family:var(--mono);opacity:.75}
.ctl .tog{padding:4px 10px;border:1px solid var(--panel-line);border-radius:4px;background:none;color:inherit;cursor:pointer}
.ctl .tog[aria-pressed="true"]{background:var(--panel-text);color:var(--panel);border-color:var(--panel-text)}
.ctl label.chk{display:flex;gap:6px;align-items:center;margin-top:8px}
.ctl :focus-visible,.stage-note :focus-visible{outline:2px solid var(--panel-text);outline-offset:2px}
.stage{display:flex;flex-direction:column;align-items:center;padding:24px 24px 16px;min-width:0;overflow:auto}
.stage-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.desktop{position:relative;display:flex;justify-content:center}
.stage-foot{margin-top:16px;font:12px/16px var(--mono);opacity:.8;text-align:center}
.mocknote{min-height:20px;margin-top:10px;font-size:12px;line-height:16px;font-family:var(--mono);opacity:.9}

/* ===== App-Fenster ===== */
.win{--w:440px;--h:720px;width:var(--w);height:var(--h);flex:none;display:flex;flex-direction:column;background:var(--mica);color:var(--text);
  border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--shadow-win);overflow:hidden;position:relative;font:14px/20px var(--font);
  font-variant-numeric:tabular-nums;zoom:var(--zoom,1)}
.win.min{--w:380px;--h:560px}
.win button,.win input{font:inherit;color:inherit}
.win :focus-visible{outline:2px solid var(--focus-outer);outline-offset:-2px;box-shadow:inset 0 0 0 3px var(--focus-inner)}
.win .chip:focus-visible,.win .btn:focus-visible,.win .seg button:focus-visible{border-radius:4px}
.tb{height:32px;flex:none;display:flex;align-items:center;padding-left:12px;font-size:12px;line-height:16px;user-select:none}
.tb .logo{width:16px;height:16px;margin-right:8px;color:var(--text)}
.tb .title{flex:1}
.cap{width:46px;height:32px;border:0;background:none;display:grid;place-items:center;color:var(--text);cursor:default}
.cap svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1}
.cap:hover{background:rgba(127,127,127,.18)}
.cap.close:hover{background:var(--close-hover);color:#fff}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--stroke-strong) transparent}

/* Kopf */
.head{padding:8px 16px 0;position:relative}
.head h1{margin:0;font-size:20px;line-height:28px;font-weight:600;overflow-wrap:anywhere}
.head h1 .way{font-size:14px;line-height:20px;font-weight:400;color:var(--text2);white-space:nowrap}
.srow{display:flex;gap:8px;align-items:flex-start}
.sentence{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start;margin:4px 0 0;font-weight:600}
.lockline{display:flex;gap:6px;align-items:flex-start;margin:2px 0 0;font-size:12px;line-height:16px}
.lockline .i{margin-top:0}
.traypv{margin-top:12px;font-size:12px;line-height:16px;font-family:var(--mono);max-width:440px;width:100%}
.strip{display:flex;align-items:center;gap:10px;margin-top:4px;padding:6px 10px;background:var(--mica2);color:var(--text);border:1px solid var(--stroke);border-radius:8px;font-family:var(--font)}
.trayic{position:relative;width:24px;height:24px;display:grid;place-items:center;flex:none;color:var(--text)}
.trayic svg.lg{width:16px;height:16px}
.trayic .bd{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--mica2)}
.trayic .bd svg{width:10px;height:10px;display:block}
.tip{background:var(--card);border:1px solid var(--stroke);border-radius:4px;padding:2px 8px;box-shadow:var(--shadow-fly)}
.trayvar{position:absolute;left:12px;top:12px;width:300px;display:flex;flex-direction:column;gap:6px;color:var(--text);font-size:12px;line-height:16px}
.trayvar .strip{margin:0;padding:4px 8px}
.deskview .ttl{font-family:var(--mono);font-size:11px;line-height:16px;color:var(--panel-text)}
.sentence svg{flex:none;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:600;padding:0 6px;border:1px solid var(--warn);color:var(--text);border-radius:4px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag svg{color:var(--warn)}
.pisw{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;min-width:28px;padding:0 6px;border:1px solid var(--ctrl-stroke);border-radius:4px;background:var(--ctrl);cursor:pointer;margin-top:0}
.pisw:hover{background:var(--ctrl-hover)}
.pisw.locked{border-color:transparent;background:none;color:var(--text2);padding:0 6px}
.pisw svg{width:16px;height:16px}

/* Symbole */
.i{width:16px;height:16px;flex:none;display:inline-block}
.i20{width:20px;height:20px}
.k-ok{color:var(--ok)}.k-warn{color:var(--warn)}.k-err{color:var(--err)}.k-info{color:var(--info)}.k-off{color:var(--text2)}
.ic{fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

/* Schaltflächen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--ctrl-stroke);border-radius:4px;background:var(--ctrl);cursor:pointer;white-space:normal;text-align:center;transition:background-color .15s ease-out}
.btn:hover{background:var(--ctrl-hover)}
.btn:active{background:var(--ctrl-press);color:var(--text2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.accent:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.accent:active{background:var(--accent-press);border-color:var(--accent-press)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--mica2);border-color:var(--stroke);color:var(--text-dis);cursor:default;font-weight:400}
.btn.accent[disabled]{background:var(--stroke);border-color:var(--stroke);color:var(--text-dis)}
.btn .i{width:16px;height:16px}
.btn.block{display:flex;width:100%}

/* InfoBar */
.bar{margin:12px 16px 0;padding:12px;border:1px solid var(--stroke);border-radius:4px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 10px;flex:none}
.bar.warn{background:var(--bar-warn)}.bar.err{background:var(--bar-err)}.bar.ok{background:var(--bar-ok)}.bar.info{background:var(--bar-info)}
.bar.warn,.bar.err,.bar.ok{border-color:transparent}
.bar .bt{font-weight:600}
.bar .bm{color:var(--text)}
.bar .bm.sec{color:var(--text2)}
.bar .acts .btn{white-space:nowrap;padding:4px 10px}
.bar .acts{grid-column:2;flex-wrap:wrap;display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.bar ul{margin:6px 0 0;padding-left:18px}

/* Prüfpunkt-Chips */
.chips-wrap{position:relative;margin:10px 16px 0;flex:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;list-style:none}
.chips li{display:flex}
.chip{width:100%;flex:1;text-align:left;display:flex;flex-direction:column;gap:1px;padding:4px 10px 6px;background:var(--card);border:1px solid var(--stroke);border-radius:4px;cursor:pointer;transition:background-color .15s ease-out,border-color .15s ease-out}
.chip:hover{background:var(--ctrl-hover)}
.chip[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .cl{font-size:12px;line-height:16px;color:var(--text2)}
.chip .cw{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:16px;font-weight:600}
.chip .cw svg{margin-top:0}
  .chip .cs{font-size:12px;line-height:16px;color:var(--text2)}
.chip.off .cw{font-weight:400;color:var(--text2)}

/* Flyout */
.fly{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--shadow-fly);padding:12px 14px 12px}
.fly.head-fly{left:16px;right:16px;top:calc(100% + 4px)}
.fly h2{margin:0 0 6px;font-size:14px;line-height:20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fly dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.fly dt{color:var(--text2);font-size:12px;line-height:16px;padding-top:2px}
.fly dd{margin:0;overflow-wrap:anywhere}
.fly dd.mono,.mono{font-family:var(--mono);font-size:12px;line-height:18px}
.fly .note{margin:8px 0 0;font-size:12px;line-height:16px;color:var(--text2)}
.fly .x{border:0;background:none;width:28px;height:28px;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--text2)}
.fly .x:hover{background:var(--ctrl-hover)}

/* Segmented, Journal */
.jhead{display:flex;align-items:center;justify-content:space-between;margin:12px 16px 8px;flex:none}
.seg{display:inline-flex;padding:2px;border:1px solid var(--stroke);border-radius:4px;background:var(--mica2);gap:2px}
.seg button{border:1px solid transparent;background:none;padding:2px 14px;border-radius:3px;cursor:pointer;min-height:28px;transition:background-color .15s ease-out}
.seg button:hover{background:var(--ctrl-hover)}
.seg button[aria-checked="true"]{background:var(--card);border-color:var(--stroke);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.jhead .cnt{font-size:12px;line-height:16px;color:var(--text2);text-align:right;max-width:58%}
.journal{flex:1;min-height:150px;margin:0 16px;background:var(--card);border:1px solid var(--stroke);border-radius:8px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--stroke-strong) transparent}
.jg{margin:0;padding:8px 12px 4px;font-size:12px;line-height:16px;font-weight:600;color:var(--text2);background:var(--card);position:sticky;top:0;z-index:1}
.jl{list-style:none;margin:0;padding:0}
.jr{display:grid;grid-template-columns:58px 16px 1fr auto;gap:0 10px;align-items:start;padding:6px 12px;border-top:1px solid var(--stroke)}
.jg + .jl .jr:first-child{border-top:0}
.jr time{color:var(--text2);font-size:12px;line-height:20px}
.jr .i{margin-top:2px}
.jr .jt{overflow-wrap:anywhere}
.jr .js{display:block;font-size:12px;line-height:16px;color:var(--text2)}
.jr .dur{font-size:12px;line-height:20px;color:var(--text);font-weight:600;white-space:nowrap}
.jempty{padding:24px 16px;text-align:center;color:var(--text2)}

/* Fuß */
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;margin-top:12px;border-top:1px solid var(--stroke);background:var(--mica2)}
.foot .sp{flex:1}
.foot .ver{font-size:12px;line-height:16px;color:var(--text2)}

/* Einrichtung */
.steps{display:flex;list-style:none;margin:12px 16px 0;padding:0;flex:none}
.steps li{flex:1;position:relative;text-align:center;font-size:12px;line-height:16px;color:var(--text2);padding-top:30px}
.steps li::before{content:"";position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--stroke-strong);opacity:.5}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--text);opacity:1}
.steps .dot{position:absolute;top:0;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--mica);border:1px solid var(--stroke-strong);color:var(--text2);z-index:1}
.steps li.done .dot{background:var(--text);border-color:var(--text);color:var(--mica)}
.steps li.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.cur{color:var(--text)}
.steps li.done{color:var(--text)}
.steps .dot svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbody{flex:1;min-height:0;padding:0 16px 12px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:8px;padding:12px 14px;margin-top:12px}
.card h2{margin:0 0 8px;font-size:14px;line-height:20px;font-weight:600}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
.card .cap2,.cap2{font-size:12px;line-height:16px;color:var(--text2)}
.inv{list-style:none;margin:0;padding:0}
.inv li{display:grid;grid-template-columns:20px 1fr;gap:0 10px;padding:8px 0;border-top:1px solid var(--stroke)}
.inv li:first-child{border-top:0;padding-top:0}.inv li:last-child{padding-bottom:0}
.inv .v{color:var(--text2);font-size:12px;line-height:16px}
.stack{display:flex;flex-direction:column;gap:8px}
.fp{display:grid;grid-template-columns:repeat(4,max-content);white-space:nowrap;justify-content:start;gap:2px 12px;font-family:var(--mono);font-size:13px;line-height:20px;margin:6px 0}
.fp b{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.kv dt{color:var(--text2);font-size:12px;line-height:20px}.kv dd{margin:0;overflow-wrap:anywhere}
.drop{margin-top:12px;border:1px dashed var(--stroke-strong);border-radius:8px;padding:20px 14px;text-align:center;background:var(--card);transition:background-color .15s ease-out,border-color .15s ease-out}
.drop.over{border-color:var(--accent);border-style:solid;background:var(--ctrl-hover)}
.drop .i20{width:28px;height:28px;color:var(--text2);margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:14px}
.tb2{height:32px;padding:0 10px;border:1px solid var(--ctrl-stroke);border-bottom-color:var(--stroke-strong);border-radius:4px;background:var(--ctrl);width:100%}
.tb2::placeholder{color:var(--text2)}
.tb2:focus-visible{outline:none;box-shadow:none;border-color:var(--ctrl-stroke);border-bottom:2px solid var(--accent)}
.radio,.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.radio input,.check input{appearance:none;flex:none;width:20px;height:20px;margin:0;border:1px solid var(--stroke-strong);background:var(--ctrl);cursor:pointer;display:grid;place-items:center}
.radio input{border-radius:50%}.check input{border-radius:4px}
.radio input:checked{border-color:var(--accent);background:var(--card);box-shadow:inset 0 0 0 5px var(--accent)}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.radio input:focus-visible,.check input:focus-visible{outline:2px solid var(--focus-outer);outline-offset:2px;box-shadow:none}
.radio .rt .cap2,.check .rt .cap2{display:block}
.list{list-style:none;margin:0;padding:0}
.list .radio{padding:8px 0;border-top:1px solid var(--stroke)}.list li:first-child .radio{border-top:0;padding-top:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:0 6px;border:1px solid var(--stroke-strong);border-radius:4px;color:var(--text2);white-space:nowrap}
.prog{height:4px;border-radius:2px;background:var(--stroke);overflow:hidden;margin:8px 0 4px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .2s linear}
ol.how{margin:6px 0 0;padding-left:20px}ol.how li{margin:2px 0}
code,.fname{font-family:var(--mono);font-size:12px;line-height:18px;overflow-wrap:anywhere}

/* Dialog */
.scrim{position:absolute;left:0;right:0;top:32px;bottom:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{width:100%;max-width:360px;background:var(--mica);border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--shadow-fly);overflow:hidden}
.dlg .db{padding:20px 20px 16px}
.dlg h2{margin:0 0 8px;font-size:20px;line-height:28px;font-weight:600}
.dlg p{margin:0}
.dlg .df{display:flex;gap:8px;padding:16px 20px;background:var(--mica2);border-top:1px solid var(--stroke)}
.dlg .df .btn{flex:1;white-space:nowrap;padding:4px 8px}

/* Desktop / Tray (Mock-Hilfe für B8) */
.deskview{position:relative;width:640px;height:420px;border:1px solid var(--panel-line);border-radius:8px;background:var(--desk);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.taskbar{height:48px;background:var(--mica2);border-top:1px solid var(--stroke);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 14px;color:var(--text);font-size:12px}
.tray{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;border-radius:4px;color:var(--text);cursor:pointer}
.tray:hover{background:var(--ctrl-hover)}
.tray svg{width:16px;height:16px}
.toast{position:absolute;right:12px;bottom:60px;width:300px;background:var(--card);color:var(--text);border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--shadow-fly);padding:12px 14px}
.toast .th{display:flex;gap:8px;align-items:center;font-size:12px;line-height:16px;color:var(--text2);margin-bottom:6px}

  .chip,.btn,.card,.journal,.bar{border:1px solid CanvasText}

}

<script>
"use strict";
/* ===================== Hilfen ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND_WORD = {ok:'Erfolg', warn:'Achtung', err:'Fehler', info:'Hinweis', help:'Unklar', off:'Nicht benutzt'};
function ico(kind, size){
  const sym = {ok:'s-ok',warn:'s-warn',err:'s-err',info:'s-info',help:'s-help',off:'s-off'}[kind];
  const cls = 'i k-'+(kind==='help'?'warn':kind) + (size===20?' i20':'');
  return `<svg class="${cls}" viewBox="0 0 20 20" aria-hidden="true"><use href="#${sym}"/></svg><span class="sr">${KIND_WORD[kind]}: </span>`;
}
function sym(name, cls=''){ return `<svg class="i ${cls}" viewBox="0 0 20 20" aria-hidden="true"><use href="#s-${name}"/></svg>`; }
function btn(label, o={}){
  const cls = 'btn'+(o.accent?' accent':'')+(o.block?' block':'');
  return `<button type="button" class="${cls}"${o.dis?' disabled':''}${o.go?` data-go="${o.go}"`:''}${o.act?` data-act="${o.act}"`:''}${o.id?` id="${o.id}"`:''}>${o.icon?sym(o.icon):''}${esc(label)}</button>`;
}
function bar(kind, title, msg, acts='', o={}){
  const icon = ico(kind==='warn'||kind==='err'||kind==='ok'||kind==='info'?kind:'info',20);
  return `<div class="bar ${kind}" role="${kind==='err'?'alert':'status'}">${icon}<div><div class="bt">${esc(title)}</div>${msg?`<div class="bm${o.sec?' sec':''}">${msg}</div>`:''}</div>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}
function groups4(hex){ return hex.match(/.{4}/g); }
const FP = 'a3f9 0c1d 7b42 e58a 19d6 f03c 84ab 2e71 5c0d b8f4 63a9 d127 0e5b c3f8 9a46 71de'.split(' ');
const FP_OTHER = 'a3f9 0c1d 7b42 e58a 19d6 f03c 84ab 2e71 5c0d b8f4 63a9 d127 55e0 1b6c 9a46 3f02'.split(' ');
const SHA = '9f2c41ab07d3e58a19d6f03c84ab2e715c0db8f463a9d1270e5bc3f89a4671de'.match(/.{4}/g);
function fp(groups, mark){ return `<div class="fp mono" aria-label="Fingerabdruck SHA-256 in Vierergruppen">${groups.map((g,i)=>mark&&mark.includes(i)?`<b>${g}</b>`:`<span>${g}</span>`).join('')}</div>`; }

/* ===================== Kopf, Chips, Journal ===================== */
const PI = 'Prüfstand 2';
const PI_LONG = 'Prüfstand 2 – Kalibrierlabor Halle B, Platz 14';
function head({name, way, sentence, kind='info', tag='', pisw='none', flyOpen=false, piswOpen=false}){
  const sw = pisw==='free'
    ? `<button type="button" class="pisw" data-act="pisw" aria-haspopup="listbox" aria-expanded="${piswOpen}" title="Anderen Pi wählen" aria-label="Anderen Pi wählen">${sym('chev')}</button>`
    : pisw==='locked'
    ? `<button type="button" class="pisw locked" data-act="lockwhy" aria-expanded="${flyOpen}" title="Pi-Wechsel gesperrt" aria-label="Pi-Wechsel gesperrt – Grund anzeigen">${sym('lock')}</button>` : '';
  let fly = '';
  if(pisw==='locked' && flyOpen) fly = `<div class="fly head-fly" role="dialog" aria-label="Pi-Wechsel gesperrt"><h2>Pi-Wechsel gesperrt</h2><p style="margin:0">Solange die Brücke an GSVmulti überträgt, bleibt der Pi festgelegt. Beenden Sie die Übertragung, um einen anderen Pi zu wählen.</p></div>`;
  if(pisw==='free' && piswOpen) fly = `<div class="fly head-fly" role="listbox" aria-label="Gekoppelte Pi"><h2>Gekoppelte Pi</h2>
    <div class="list"><ul class="list" style="margin:0">
      <li><label class="radio"><input type="radio" name="pisel" value="a"><span class="rt">${esc(PI)}<span class="cap2">pi-4b7e09c1 · zuletzt vor 2 Stunden</span></span></label></li>
      <li><label class="radio"><input type="radio" name="pisel" value="b" checked><span class="rt">Prüfstand 3 – Halle A<span class="cap2">pi-d21a77e6 · zuletzt gestern</span></span></label></li>
    </ul></div><p class="note">Nach dem Wechsel muss neu verbunden werden. Ein Wechsel während der Übertragung ist nicht möglich.</p></div>`;
  return `<header class="head"><h1 title="${esc(name)} · ${esc(way)}">${esc(name)} <span class="way">· ${esc(way)}</span></h1>
  <div class="srow"><p class="sentence">${ico(kind,20)}<span>${esc(sentence)}${tag?`<span class="tag">${sym('warn')}${esc(tag)}</span>`:''}</span></p>${sw}</div>
  <p class="lockline">${ico('warn')}<span>DUT-Ausgabe gesperrt – die Brücke gibt keine Messwerte frei</span></p>${fly}</header>`;
}
function chip(c, open){
  return `<li><button type="button" class="chip ${c.k==='off'?'off':''}" data-chip="${c.id}" aria-expanded="${open===c.id}" aria-haspopup="dialog"><span class="cl">${esc(c.l)}</span><span class="cw">${ico(c.k)}<span>${esc(c.w)}</span></span>${c.sub?`<span class="cs">${esc(c.sub)}</span>`:''}</button></li>`;
}
function chipsBlock(list, open){
  let fly = '';
  const o = list.find(c=>c.id===open);
  if(o){
    fly = `<div class="fly" role="dialog" aria-label="${esc(o.l)} – Details"><h2><span>${esc(o.title||o.l)}</span><button type="button" class="x" data-act="closefly" aria-label="Details schließen">${sym('close')}</button></h2>
    <dl>${o.d.map(([k,v,m])=>`<dt>${esc(k)}</dt><dd class="${m?'mono':''}">${Array.isArray(v)?fp(v):esc(v)}</dd>`).join('')}</dl>${o.note?`<p class="note">${esc(o.note)}</p>`:''}</div>`;
  }
  return `<div class="chips-wrap"><ul class="chips" aria-label="Prüfpunkte">${list.map(c=>chip(c,open)).join('')}</ul>${fly}</div>`;
}
const PI_DETAIL = (extra={}) => [
  ['Pi-ID','pi-4b7e09c1',true],
  ['Endpunkt','wss://192.168.10.24 (LAN, Beispiel)',true],
  ['TLS-Fingerabdruck (SHA-256)',FP,true],
  ['Protokoll','Version 2'],
  ['Letzte Quittung','COM-Weitergabe bestätigt (Bild 18342) – kein GSVmulti-Empfangsnachweis'],
];
function baseChips(o={}){
  const tested = UI.tested;
  const c = {
    komp:{id:'komp',l:'Komponenten',k:'ok',w:'Installiert',d:[['Windows','11, 64 Bit'],['App-Version','0.1.0.dev0'],['Portpaar','COM4 ↔ COM5 (com0com)']],note:'Alle Systemkomponenten sind vorhanden. Das sagt nichts über Verbindung oder Empfang.'},
    uart:{id:'uart',l:'UART',k:'off',w:'nicht benutzt',d:[['Weg','Netzwerk (LAN)'],['USB-Adapter','nicht benutzt']],note:'Ein USB-Adapter wird nur im Weg „UART“ gebraucht.'},
    pi:{id:'pi',l:'Pi',k:'ok',w:'Verbunden',title:'Pi – technische Werte',d:PI_DETAIL()},
    out:{id:'out',l:'Ausgabe',k:'warn',w:'DUT gesperrt',d:[['Ausgabe','DUT-Ausgabe gesperrt'],['Bedeutung','Der Pi gibt die Messwerte des Prüflings noch nicht frei.']],note:'Die Brücke gibt nichts frei und startet keine Messung.'},
    com:{id:'com',l:'Weitergabe',k:'ok',w:'Bestätigt',sub:'vom Port angenommen',d:[['Brückenseite','COM4'],['GSVmulti-Seite','COM5'],['Letzte Quittung','COM-Weitergabe bestätigt (Bild 18342) – kein GSVmulti-Empfangsnachweis']],note:'„Bestätigt“ heißt: der Windows-Port hat die Daten angenommen.'},
    gsv: tested
      ? {id:'gsv',l:'GSVmulti',k:'ok',w:'Empfang belegt',sub:'Test 14:02, 600/600',d:[['Session','GSVmulti_Prüfstand2_COM5.ucf'],['Übernahme','vom Bediener bestätigt'],['Empfangsnachweis','Belegt für die Testdatei GSVmulti_Test_Prüfstand2.txt und diese Konfiguration (600/600)']],note:'Gilt nur für genau diese Konfiguration, nicht für spätere Läufe.'}
      : {id:'gsv',l:'GSVmulti',k:'info',w:'Übernahme bestätigt',sub:'Empfang nicht nachgewiesen',d:[['Session','GSVmulti_Prüfstand2_COM5.ucf'],['Übernahme','vom Bediener bestätigt (keine Prüfung durch die Brücke)'],['Empfangsnachweis','nicht nachgewiesen']],note:'Nur der Empfangstest belegt Empfang. Der laufende Betrieb zeigt nur die COM-Weitergabe.'},
  };
  for(const [k,v] of Object.entries(o)) c[k] = {...c[k], ...v};
  return Object.values(c);
}
/* Journal-Einträge: [gruppe, zeit, art, text, sub, dauer] */
const J_BASE = [
  ['Heute','14:32:07','ok','Neuer Lauf erkannt','Lauf 7 · DUT-Ausgabe gesperrt'],
  ['Heute','14:31:55','info','Pi-Lauf beendet','Lauf 6'],
  ['Heute','14:12:40','warn','Verbindung unterbrochen','wieder verbunden · Netzwerk (LAN), gleicher Pi','4 s'],
  ['Heute','14:05:12','ok','Weitergabe bestätigt','Erster Wert dieses Laufs · COM4 → COM5'],
  ['Heute','13:58:30','ok','Pi verbunden (Identität geprüft)','Prüfstand 2 · pi-4b7e09c1'],
  ['Heute','13:58:29','info','Brücke gestartet','Version 0.1.0.dev0'],
  ['Gestern','17:02:11','info','Brücke beendet','Auf Wunsch des Bedieners'],
  ['Gestern','16:20:03','err','COM4 (Brückenseite): Schreibfehler','Wert nicht erneut gesendet · weiter mit dem nächsten Wert','1 Wert'],
  ['Gestern','15:44:51','warn','Pi antwortet nicht','wieder verbunden · Versuche nach 1, 2, 4, 8 s','14 s'],
  ['Gestern','15:10:02','ok','Pi verbunden (Identität geprüft)','Prüfstand 2 · pi-4b7e09c1'],
];
function journal(rows, filter, jfor){
  const list = filter==='stoer' ? rows.filter(r=>r[2]==='warn'||r[2]==='err') : rows;
  let html='';
  if(!list.length) html = `<div class="jempty">Keine Störungen seit dem Start der Brücke.</div>`;
  else {
    let g=null, open=false;
    for(const r of list){
      if(r[0]!==g){ if(open) html+='</ul>'; g=r[0]; html+=`<h3 class="jg">${esc(g)}</h3><ul class="jl">`; open=true; }
      html += `<li class="jr"><time datetime="${r[1]}">${r[1]}</time>${ico(r[2])}<span class="jt">${esc(r[3])}${r[4]?`<span class="js">${esc(r[4])}</span>`:''}</span>${r[5]?`<span class="dur">${esc(r[5])}</span>`:'<span></span>'}</li>`;
    }
    if(open) html+='</ul>';
  }
  return `<div class="jhead"><div class="seg" role="radiogroup" aria-label="Ereignisse filtern">
    <button type="button" role="radio" aria-checked="${filter!=='stoer'}" data-filter="alle">Alle</button>
    <button type="button" role="radio" aria-checked="${filter==='stoer'}" data-filter="stoer">Störungen</button></div>
    <span class="cnt">${list.length} ${list.length===1?'Eintrag':'Einträge'}${jfor?' · '+esc(jfor):''}</span></div>
    <div class="journal" role="region" aria-label="Ereignisjournal" tabindex="0">${html}</div>`;
}
function foot(setup){
  if(setup) return '';
  return `<footer class="foot">${btn('Diagnose exportieren',{act:'diag'})}${btn('Details',{act:'details'})}<span class="sp"></span><span class="ver">Version 0.1.0.dev0</span></footer>`;
}

/* ===================== Betriebsansicht ===================== */
function ops(o){
  const {name=PI, way='Netzwerk (LAN)', sentence, kind='info', tag, pisw='locked', chips=baseChips(), journalRows=J_BASE, infobar='', jfor=''} = o;
  UI.trayInfo = {kind, text:sentence};
  return `<div class="main">${head({name,way,sentence,kind,tag,pisw,flyOpen:UI.lockOpen,piswOpen:UI.piswOpen})}${infobar}
    ${chipsBlock(chips, UI.open)}${journal(journalRows, UI.filter, jfor)}</div>${foot(false)}`;
}

/* ===================== Einrichtung ===================== */
const STEPS = ['Komponenten','Pi koppeln','Verbinden','Session','Empfangstest'];
function stepper(cur){
  return `<ol class="steps" aria-label="Einrichtungsschritte">${STEPS.map((s,i)=>{
    const st = i+1<cur?'done':i+1===cur?'cur':'todo';
    const dot = st==='done'?`<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.4 2.4 4.6-5"/></svg>`:String(i+1);
    return `<li class="${st}"${st==='cur'?' aria-current="step"':''}><span class="dot">${dot}</span>${s}${st==='done'?'<span class="sr"> (erledigt)</span>':''}</li>`;
  }).join('')}</ol>`;
}
function setup(o){
  UI.mount = o.mount||null;
  const {step, name='Kein Pi gekoppelt', way='Weg noch offen', sentence, kind='info', body, back, next, nextGo, nextLabel='Weiter', nextEnabled=false} = o;
  const f = `<footer class="foot">${btn('Diagnose exportieren',{act:'diag'})}<span class="sp"></span>
    ${back?btn('Zurück',{go:back}):''}${btn(nextLabel,{accent:nextEnabled,dis:!nextEnabled,go:nextEnabled?nextGo:undefined,id:'next'})}</footer>`;
  return `<div class="main">${head({name,way,sentence,kind})}${stepper(step)}<div class="sbody scroll" tabindex="-1">${o.bar||''}${body}</div></div>${f}`;
}
function inv(items){ return `<ul class="inv">${items.map(([k,t,v])=>`<li>${ico(k)}<div><div>${esc(t)}</div><div class="v">${esc(v)}</div></div></li>`).join('')}</ul>`; }
const OK_WIN = ['ok','Windows 11, 64 Bit','Unterstützte Windows-Version'];
const OK_APP = ['ok','Brücke 0.1.0.dev0','Installiert'];

/* ===================== Zustände ===================== */
const S = {}; const ORDER = [];
function def(id, group, label, fn, o={}){ S[id]={id,group,label,fn,...o}; ORDER.push(id); }

/* --- Einrichtung --- */
def('E1','Einrichtung','Komponenten: Portpaar fehlt',()=>setup({step:1,sentence:'Schritt 1 von 5: Komponenten prüfen.',
  body:`<div class="card"><h2>Bestandsaufnahme</h2>${inv([OK_WIN,OK_APP,['warn','COM-Portpaar fehlt','Für GSVmulti wird ein virtuelles Portpaar (com0com) mit freien COM-Namen benötigt.']])}</div>
  <div class="card"><p>Die Brücke legt das Portpaar einmalig an. Windows fragt dafür nach der Administratorfreigabe. Es wird nichts verändert, was bereits vorhanden ist.</p>
  ${btn('Portpaar einrichten (Administratorfreigabe)',{accent:true,block:true,icon:'shield',go:'E1ok'})}</div>`}));
def('E1uac','Einrichtung','… UAC abgelehnt',()=>setup({step:1,sentence:'Schritt 1 von 5: Komponenten prüfen.',
  bar:bar('err','IT-Freigabe erforderlich','Windows hat die Administratorfreigabe nicht erteilt. Die Brücke ändert ohne Freigabe nichts. Bitten Sie Ihre IT, das Portpaar einzurichten; danach genügt „Erneut prüfen“.',btn('Diagnose exportieren',{act:'diag'})+btn('Erneut prüfen',{accent:true,go:'E1'})),
  body:`<div class="card"><h2>Bestandsaufnahme</h2>${inv([OK_WIN,OK_APP,['err','COM-Portpaar fehlt','Einrichtung nicht möglich ohne Administratorfreigabe.']])}</div>`}));
def('E1restart','Einrichtung','… Neustart nötig',()=>setup({step:1,sentence:'Schritt 1 von 5: Komponenten prüfen.',

function e3(mode){
  const sel = mode==='net'?'net':'uart';
  const radios = `<div class="card" style="padding-top:8px;padding-bottom:8px" role="radiogroup" aria-label="Verbindungsweg">
    <label class="radio"><input type="radio" name="weg" ${sel==='net'?'checked':''} data-go="E3"><span class="rt">Netzwerk<span class="cap2">LAN oder Tailscale, verschlüsselt</span></span></label>
    <label class="radio"><input type="radio" name="weg" ${sel==='uart'?'checked':''} data-go="${mode==='uart2'?'E3uart2':'E3uart'}"><span class="rt">UART (USB-Adapter)<span class="cap2">Direktverbindung, unverschlüsselt</span></span></label></div>`;
  let body, bar_='', nextEn=false;
  if(mode==='net'){
    body = radios + `<div class="card"><h2>Gefundene Pi im Netz</h2>
      <ul class="list"><li><label class="radio"><input type="radio" name="cand" checked><span class="rt"><span>prüfstand2.local ${'<span class="badge">'+sym('info','k-info')+'Unbestätigt</span>'}</span><span class="cap2">192.168.10.24 · gefunden per mDNS</span></span></label></li>
      <li><label class="radio"><input type="radio" name="cand"><span class="rt"><span>pi-labor-b.local <span class="badge">${sym('info','k-info')}Unbestätigt</span></span><span class="cap2">192.168.10.37 · gefunden per mDNS</span></span></label></li></ul>
      <p class="cap2" style="margin-top:8px">Ein gefundener Name ist kein Identitätsnachweis. Erst die Prüfung gegen das Profil bestätigt den Pi.</p>
      <div class="field"><label for="manual">Adresse oder Name manuell eintragen</label><input class="tb2" id="manual" placeholder="z. B. 192.168.10.24 oder Tailscale-Name" spellcheck="false"></div>
      <div class="cap2" style="margin-top:6px">Tailscale wird nur benutzt, wenn Sie hier den Tailscale-Namen oder die Adresse eintragen. Ohne Tailscale braucht es ein gemeinsames Netz oder die VPN-Route Ihrer IT.</div>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">${btn('Suche wiederholen',{icon:'refresh',act:'search'})}</div></div>`;
  } else {
    const adapters = mode==='uart2'
      ? `<ul class="list"><li><label class="radio"><input type="radio" name="ad"><span class="rt">USB-Seriell-Adapter · COM6<span class="cap2">USB-Ort: Port 3 (Hub 1)</span></span></label></li>
         <li><label class="radio"><input type="radio" name="ad"><span class="rt">USB-Seriell-Adapter · COM7<span class="cap2">USB-Ort: Port 4 (Hub 1)</span></span></label></li></ul>`
      : `<ul class="list"><li><label class="radio"><input type="radio" name="ad" checked><span class="rt">USB-Seriell-Adapter · COM6<span class="cap2">USB-Ort: Port 3</span></span></label></li></ul>`;
    if(mode==='uart2') bar_ = bar('warn','Zwei gleiche Adapter – Auswahl nötig','Die Adapter lassen sich nur am USB-Anschluss unterscheiden. Wählen Sie den Adapter, der am Pi hängt.','');
    body = radios + `<div class="card"><h2>USB-Adapter</h2>${adapters}</div>
      <div class="card"><h2>Verdrahtung</h2><p>115200 Baud, 8N1, kein Handshake.<br>TX des Adapters an RX des Pi, RX des Adapters an TX des Pi, GND an GND. VCC, CTS und RTS bleiben frei.</p>
      </div>`;
  }
  return setup({step:3,name:PI,way:mode==='net'?'Netzwerk (LAN)':'UART (USB-Adapter)',sentence:'Schritt 3 von 5: Weg zum Pi wählen.',back:'E2ok',bar:bar_,body,
    nextLabel:'Verbinden',nextEnabled:mode!=='uart2',nextGo:mode==='net'?'E3ok':'E3fail',
    mount(w){ if(mode!=='uart2') return; const n=$('#next',w); $$('input[name=ad]',w).forEach(r=>r.addEventListener('change',()=>{ n.disabled=false; n.classList.add('accent'); n.dataset.go='E3fail'; })); }});
}

function e5(stage){
  const warn = bar('warn','Synthetischer Test – getrennte GSVmulti-Testsession verwenden','Die Testwerte sind künstlich und dürfen nicht in einer Kalibriermessung landen.');
  const opts = {step:5,name:PI,way:'Netzwerk (LAN)',back:'E4ok',sentence:'Schritt 5 von 5: Empfang prüfen.'};
  if(stage==='start') return setup({...opts,bar:warn,body:`<div class="card"><h2>Empfangstest</h2><p>Die Brücke sendet 600 synthetische Werte mit 10 Hz (etwa 60 s). GSVmulti zeichnet sie in der Testsession auf.</p>
    <label class="check"><input type="checkbox" id="tsess"><span class="rt">Ich verwende eine getrennte GSVmulti-Testsession.</span></label>
    <div style="margin-top:10px">${btn('Test starten',{accent:true,dis:true,id:'tstart',go:'E5run'})}</div></div>`,
    mount(w){ const c=$('#tsess',w), b=$('#tstart',w); c.addEventListener('change',()=>{ b.disabled=!c.checked; }); }});
  if(stage==='run') return setup({...opts,bar:warn,body:`<div class="card"><h2>Test läuft</h2><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="600" aria-valuenow="312" aria-label="Gesendete Testwerte"><span id="pbar" style="width:52%"></span></div>
    <p id="pt"><span id="pn">312</span> von 600 Werten gesendet (10 Hz, synthetisch)</p><div style="display:flex;justify-content:flex-end">${btn('Abbrechen',{go:'E5'})}</div></div>`,
    mount(w){ if(!UI.live) return; UI.live=false; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let n=0; const bar=$('#pbar',w), pn=$('#pn',w), pb=$('[role=progressbar]',w);
      const t=setInterval(()=>{ n+= reduce?600:25; if(n>=600){ n=600; clearInterval(t); setTimeout(()=>{ if(UI.cur==='E5run') go('E5file'); },reduce?0:400); }
        if(!$('#pn')) {clearInterval(t);return;} pn.textContent=n; bar.style.width=(n/6)+'%'; pb.setAttribute('aria-valuenow',n); },60); }});
  if(stage==='file') return setup({...opts,bar:warn,body:`<div class="card"><h2>Testdatei auswählen</h2><p>Der Test ist gesendet. Speichern Sie die Aufzeichnung in GSVmulti und wählen Sie die originale Datei aus. Die Brücke vergleicht jeden Wert und die Reihenfolge.</p>
    <div style="margin-top:10px">${btn('Testdatei auswählen …',{accent:true,icon:'file',go:'E5ok'})}</div>
</div>`});
  if(stage==='ok') return setup({...opts,sentence:'Empfang belegt für diese Testdatei und Konfiguration',kind:'ok',nextEnabled:true,nextGo:'B1t',nextLabel:'Fertig',
    bar:bar('ok','600/600 Werte stimmen überein','Der Vergleich gilt nur für die ausgewählte Testdatei und diese Konfiguration, nicht für spätere Läufe.'),
    body:`<div class="card"><dl class="kv"><dt>Datei</dt><dd class="mono">GSVmulti_Test_Prüfstand2.txt</dd><dt>Test</dt><dd>14:02, synthetisch</dd><dt>Werte</dt><dd>600 von 600</dd><dt>SHA-256</dt><dd></dd></dl>${fp(SHA)}
    <p class="cap2">Im Betrieb zeigt die Brücke danach „Empfang belegt“ nur für diese Konfiguration; die COM-Weitergabe bleibt eine eigene Aussage.</p></div>`});
  return setup({...opts,sentence:'Schritt 5 von 5: Empfang nicht belegt.',kind:'err',back:'E5',
    bar:bar('err','Abweichung: 598/600','Zwei Werte der Testdatei stimmen nicht mit dem Test überein. Der Empfang ist für diese Datei nicht belegt.',btn('Diagnose exportieren',{act:'diag'})+btn('Test wiederholen',{accent:true,go:'E5'})),
    body:`<div class="card"><h2>Fehlende Werte</h2><dl class="kv"><dt>Nr. 211</dt><dd>fehlt in der Testdatei</dd><dt>Nr. 212</dt><dd>fehlt in der Testdatei</dd></dl></div>`});
}

def('B10','Betrieb','Anderer Pi in Auswahl (frei)',()=>ops({name:'Prüfstand 3 – Halle A',way:'Netzwerk (LAN)',sentence:'Nicht verbunden – Pi ausgewählt',kind:'info',pisw:'free',jfor:'Prüfstand 3 – Halle A',
  infobar:bar('info','Es läuft keine Übertragung','Ein Pi-Wechsel ist jetzt möglich. Verbinden Sie danach neu.',btn('Verbinden',{accent:true,act:'connect'})),
  chips:baseChips({pi:{k:'off',w:'nicht verbunden',d:[['Pi-ID','pi-d21a77e6',true],['Status','Nicht verbunden']]},out:{k:'off',w:'unbekannt',d:[['Ausgabe','Unbekannt, solange nicht verbunden']]},com:{k:'off',w:'Keine',sub:'Übertragung',note:''},gsv:{k:'off',w:'Noch nicht gekoppelt',sub:'Empfang nicht nachgewiesen',d:[['Session','Für diesen Pi noch nicht erzeugt']],note:''}}),
  journalRows:[['Heute','14:40:02','info','Pi ausgewählt','Prüfstand 3 – Halle A · pi-d21a77e6'],['Gestern','16:02:44','info','Brücke beendet','Prüfstand 3 – Halle A · auf Wunsch des Bedieners'],['Gestern','14:20:11','ok','Pi verbunden (Identität geprüft)','Prüfstand 3 – Halle A · pi-d21a77e6']]}),{piswOpen:true});

/* ===================== Zustand, Rendering ===================== */
const UI = {cur:'B1', theme:'light', zoom:1, min:false, filter:'alle', open:null, lockOpen:false, piswOpen:null, dialog:false, live:false, prev:null};
function go(id, fromApp){
  if(!S[id]) return;
  if(location.hash.slice(1)!==id) location.hash = id; else route();
  if(fromApp) UI.focusMain = true;
}
function route(){
  const id = location.hash.slice(1);
  if(!S[id]){ UI.cur='B1'; } else UI.cur = id;
  const st = S[UI.cur];
  UI.open = st.open||null; UI.lockOpen=false; UI.dialog = !!st.dialog; UI.piswOpen = !!st.piswOpen;
  if(st.zoom){ UI.zoom=st.zoom; }
  render();
}
function titlebar(){
  return `<div class="tb"><svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><use href="#s-logo"/></svg><span class="title">GSVmulti-Brücke</span>
  <button class="cap" data-act="min" aria-label="Minimieren"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button class="cap" data-act="max" aria-label="Maximieren" aria-disabled="true"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1"/></svg></button>
  <button class="cap close" data-act="close" aria-label="Schließen"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></div>`;
}
const TRANSMITTING = id => /^B([1-9])/.test(id) && id!=='B2' && id!=='B3' && id!=='B8' || id==='B2' || id==='B3';
function render(){
  const st = S[UI.cur];
  const desk = $('#desktop');
  if(st.desktop && !UI.restored){ desk.innerHTML = deskHtml(); wireDesk(); UI.trayInfo=null; renderTray(); updateCtl(); return; }
  const w = document.createElement('div'); w.className = 'win'+(UI.min?' min':''); w.setAttribute('role','application'); w.setAttribute('aria-label','GSVmulti-Brücke');
  w.style.setProperty('--zoom', UI.zoom);
  let inner; UI.mount=null; UI.trayInfo=null;
  if(st.desktop){ inner = ops({sentence:'Verbunden – DUT-Ausgabe gesperrt',kind:'info'}); }
  else { inner = st.fn(); }
  // Zustand-abhängige Parameter nachreichen (Flyouts, Filter)
  w.innerHTML = titlebar() + `<div class="app" id="app">${inner}</div>`;
  desk.replaceChildren(w);
  renderTray();
  if(UI.mount) UI.mount(w);
  wire(w); wireInner(w);
  if(UI.dialog) openDialog(w);
  if(UI.focusMain){ UI.focusMain=false; const h=$('h1',w); if(h){h.tabIndex=-1;h.focus({preventScroll:true});} }
  updateCtl();
}
/* Flyout-/Filter-Zustand erneut rendern, ohne den Zustand zu wechseln */
function rerender(keepFocusSel){
  const st = S[UI.cur]; const w=$('.win'); if(!w) return;
  const app = $('#app',w);
  const sc = $('.journal',w)?.scrollTop||0;
  UI.mount=null; app.innerHTML = st.fn();
  if(UI.mount) UI.mount(w);
  wireInner(w);
  const j=$('.journal',w); if(j) j.scrollTop=sc;
  if(keepFocusSel){ const e=$(keepFocusSel,w); if(e) e.focus(); }
}
function wireInner(w){
  $$('input[data-go]',w).forEach(i=>i.addEventListener('change',()=>go(i.dataset.go,true)));
  const drop=$('#drop',w);
  if(drop){ ['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();go('E2b',true);}); }
}
function wire(w){
  w.addEventListener('click', e=>{
    const t = e.target.closest('[data-chip],[data-act],[data-go],[data-filter]'); if(!t) return;
    if(t.dataset.chip){  UI.open = (UI.open===t.dataset.chip)?null:t.dataset.chip; rerender(`[data-chip="${t.dataset.chip}"]`); return; }
    if(t.dataset.filter){ UI.filter=t.dataset.filter; rerender(`[data-filter="${t.dataset.filter}"]`); return; }
    if(t.dataset.go && t.tagName!=='INPUT'){ e.preventDefault(); if(t.disabled) return; go(t.dataset.go,true); return; }
    if(t.dataset.act){ act(t.dataset.act,t,w); }
  });
  w.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(UI.dialog){ closeDialog(); return; }
      if(UI.open||UI.lockOpen||UI.piswOpen){ const prev=UI.open; UI.open=null; UI.lockOpen=false; UI.piswOpen=null;   rerender(prev?`[data-chip="${prev}"]`:null); }
    }
    // Pfeiltasten im Segmented
    if(e.target.closest('.seg') && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ const b=$$('.seg button',w); const i=b.indexOf(e.target); const n=b[(i+(e.key==='ArrowRight'?1:b.length-1))%b.length]; n.click(); }
  });
  // Klick außerhalb schließt Flyout
  w.addEventListener('mousedown', e=>{
    if((UI.open||UI.lockOpen||UI.piswOpen) && !e.target.closest('.fly,.chip,.pisw')){ UI.open=null;UI.lockOpen=false;UI.piswOpen=null; rerender(); }
  });
}
function act(a,t,w){
  const note = m => { $('#mocknote').textContent = m; };
  if(a==='closefly'){ const prev=UI.open; UI.open=null;  rerender(prev?`[data-chip="${prev}"]`:null); }
  else if(a==='lockwhy'){ UI.lockOpen=!UI.lockOpen; rerender('[data-act="lockwhy"]'); }
  else if(a==='pisw'){  UI.piswOpen=!UI.piswOpen; rerender('[data-act="pisw"]'); }
  else if(a==='close'){ if(TRANSMITTING(UI.cur)||UI.cur==='B7'){ UI.dialog=true; openDialog(w); } else note('Mock: Schließen ohne aktive Übertragung beendet die Brücke ohne Rückfrage.'); }
  else if(a==='min'){ UI.restored=false; UI.prev=UI.cur; go('B8'); }
  else if(a==='max'){ note('Mock: Maximieren ist ausgeschaltet; das Fenster hat eine feste Standardgröße.'); }
  else if(a==='diag') note('Mock: „Diagnose exportieren“ speichert eine ZIP-Datei ohne Zugangsdaten.');
  else if(a==='details'){  UI.open = UI.open==='__d'?null:'__d'; rerenderDetails(); }
  else if(a==='retry'||a==='connect'||a==='abort'||a==='search'||a==='folder'||a==='restart') note('Mock: Aktion „'+t.textContent.trim()+'“ – im Mock ohne Wirkung.');
}
function rerenderDetails(){
  const w=$('.win'); const main=$('.main',w); if(!main||$('.fly.details')) { $('.fly.details')?.remove(); UI.open=null; return; }
  const d=document.createElement('div'); d.className='fly details'; d.style.cssText='left:16px;right:16px;bottom:56px;top:auto;position:absolute';
  d.setAttribute('role','dialog'); d.setAttribute('aria-label','Details');
  d.innerHTML=`<h2><span>Details</span><button type="button" class="x" aria-label="Details schließen">${sym('close')}</button></h2><dl><dt>App</dt><dd>0.1.0.dev0</dd><dt>Brückenseite</dt><dd>COM4</dd><dt>Gegenport</dt><dd>COM5</dd><dt>Pi-ID</dt><dd class="mono">pi-4b7e09c1</dd><dt>Protokoll</dt><dd>Version 2</dd><dt>Journal</dt><dd>Begrenzt, Zugangsdaten werden nicht protokolliert.</dd></dl>`;
  $('#app',w).appendChild(d); $('.x',d).focus();
  $('.x',d).addEventListener('click',()=>{d.remove();UI.open=null;});
  d.addEventListener('keydown',e=>{if(e.key==='Escape'){d.remove();UI.open=null;$('[data-act="details"]',w)?.focus();}});
}

/* Dialog */
function openDialog(w){
  if($('.scrim',w)) return;
  const s=document.createElement('div'); s.className='scrim';
  s.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd"><div class="db"><h2 id="dt">Brücke beenden?</h2><p id="dd">Die Übertragung an GSVmulti endet. Der Lauf auf dem Pi läuft weiter.</p></div>
  <div class="df"><button type="button" class="btn accent" id="dkeep">Weiter übertragen</button><button type="button" class="btn" id="dquit">Beenden</button></div></div>`;
  w.appendChild(s); UI.dialog=true;
  const keep=$('#dkeep',s), quit=$('#dquit',s);
  keep.focus();
  keep.addEventListener('click',closeDialog);
  quit.addEventListener('click',()=>{ closeDialog(); $('#mocknote').textContent='Mock: „Beenden“ stoppt die Übertragung; das Fenster würde sich schließen.'; });
  s.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ e.stopPropagation(); closeDialog(); }
    if(e.key==='Tab'){ const f=[keep,quit]; const i=f.indexOf(document.activeElement); e.preventDefault(); f[(i+(e.shiftKey?1:1))%2].focus(); }
  });
}
function closeDialog(){ const w=$('.win'); $('.scrim',w)?.remove(); UI.dialog=false; $('[data-act="close"]',w)?.focus(); }

/* Tray (Mock-Vorschau) */
const TRAY_TXT = {info:'Verbunden – Lauf 7 wird übertragen',warn:'Weitergabe gestört – COM4 belegt',err:'Pi antwortet nicht – Versuch in 4 s'};
function trayIcon(kind){
  const bd = kind==='warn'||kind==='err'||kind==='help' ? `<span class="bd"><svg viewBox="0 0 20 20" class="k-${kind==='help'?'warn':kind}" aria-hidden="true"><use href="#s-${kind==='help'?'warn':kind}"/></svg></span>` : '';
  return `<span class="trayic"><svg class="lg" viewBox="0 0 16 16" aria-hidden="true"><use href="#s-logo"/></svg>${bd}</span>`;
}
function renderTray(){
  const el=$('#traypv'); if(!el) return;
  const t=UI.trayInfo;
  if(!t){ el.innerHTML=''; return; }
  el.innerHTML = `Mock – Infobereich (nicht Teil des Fensters)<div class="strip">${trayIcon(t.kind)}<span class="tip">${esc(t.text)}</span></div>`;
}
function deskHtml(){
  const v = k => `<div class="strip">${trayIcon(k)}<span class="tip">${esc(TRAY_TXT[k])}</span></div>`;
  return `<div class="deskview" aria-label="Windows-Desktop, Mock"><div class="trayvar"><span class="ttl">Mock – Tray-Symbol: Normal · Achtung · Fehler. Tooltip = Kopfsatz. Zustandswechsel ändern nur Symbol und Tooltip, kein neues Pop-up.</span>${v('info')}${v('warn')}${v('err')}</div>
  <div class="toast" role="status"><div class="th">${sym('logo')} GSVmulti-Brücke</div><b>Die Brücke läuft im Infobereich weiter.</b><span class="cap2">Dieser Hinweis erscheint nur einmal. Ein Klick auf das Symbol öffnet das Fenster.</span></div>
  <div class="taskbar"><button class="tray" data-tray aria-label="GSVmulti-Brücke im Infobereich – Fenster öffnen" title="Verbunden – Lauf 7 wird übertragen">${trayIcon('info')}</button><span>14:35</span></div></div>`;
}
function wireDesk(){ $('[data-tray]').addEventListener('click',()=>{ UI.restored=true; go(UI.prev&&UI.prev!=='B8'?UI.prev:'B1'); setTimeout(()=>UI.restored=false,0); }); }

/* Mock-Steuerung */
function buildList(){
  let html='', g=null;
  for(const id of ORDER){ const s=S[id]; if(s.group!==g){ g=s.group; html+=`<h3>${g}</h3>`; }
    html+=`<button class="pick" data-state="${id}" aria-current="false"><span class="id">${id}</span>${esc(s.label)}</button>`; }
  $('#statelist').innerHTML=html;
  $('#statelist').addEventListener('click',e=>{ const b=e.target.closest('[data-state]'); if(b){ UI.restored=false; go(b.dataset.state); } });
}
function updateCtl(){
  $$('#statelist .pick').forEach(b=>b.setAttribute('aria-current',b.dataset.state===UI.cur?'true':'false'));
  $$('[data-theme-btn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeBtn===UI.theme));
  $$('[data-zoom]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.zoom)===UI.zoom));
  $('#minwin').checked=UI.min;
}
$$('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>{ UI.theme=b.dataset.themeBtn; document.documentElement.dataset.theme=UI.theme; updateCtl(); }));
$$('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{ UI.zoom=Number(b.dataset.zoom); $('.win')?.style.setProperty('--zoom',UI.zoom); updateCtl(); }));
$('#minwin').addEventListener('change',e=>{ UI.min=e.target.checked; $('.win')?.classList.toggle('min',UI.min); });
if(matchMedia('(prefers-color-scheme: dark)').matches){ UI.theme='dark'; document.documentElement.dataset.theme='dark'; }
const q=new URLSearchParams(location.search); if(q.get('theme')){ UI.theme=q.get('theme'); document.documentElement.dataset.theme=UI.theme; }
if(q.get('zoom')) UI.zoom=Number(q.get('zoom'));
if(q.get('min')) UI.min=true;
buildList();
window.addEventListener('hashchange',()=>{ $('#mocknote').textContent=''; if(UI.cur==='E5file'||true){} UI.live = location.hash==='#E5run' && UI.fromClick; route(); });
document.addEventListener('click',e=>{ if(e.target.closest('#tstart')) UI.fromClick=true; else if(!e.target.closest('[data-go]')) {} },true);
route();
</script>
</body>
</html>
