# Doku-Seite für picam-ai (dispread) — Prototyp mit Zensical.
#
# Immer über das Skript bauen, nicht zensical direkt aufrufen — es legt vorher
# die Symlinks in docs-site/ an (Begründung und Einrichtung dort):
#
#   ./scripts/docs-site.sh build                          -> site/
#   ./scripts/docs-site.sh serve --dev-addr 127.0.0.1:8765

[project]
site_name = "picam-ai · dispread"
site_description = "Optische Displayauslesung von Messverstärkern im Kalibrierlabor"
docs_dir = "docs-site"
site_dir = "site"
repo_url = "https://ds1515.me-systeme.de/l.hentschke/picam-ai"
repo_name = "picam-ai"

nav = [
  { "Start" = "index.md" },
  { "Projekt" = [
    { "Konzept (autoritativ)" = "Konzept.md" },
    { "Aktueller Stand" = "docs/status.md" },
    { "Arbeitsliste" = "TODO.md" },
    { "Roadmap" = "docs/ROADMAP.md" },
    { "Geplante Features" = "PLANNED_FEATURES.md" },
    { "Changelog" = "CHANGELOG.md" },
  ] },
  { "Selbst programmieren" = [
    "docs/anleitung/README.md",
    "docs/anleitung/00-werkzeuge.md",
    "docs/anleitung/01-kette-verstehen.md",
    "docs/anleitung/02-vertraege.md",
    "docs/anleitung/03-erste-bildquelle-folder.md",
    "docs/anleitung/04-geraeteprofile.md",
    "docs/anleitung/05-cli.md",
    "docs/anleitung/06-kamera-aufnahme-replay.md",
    "docs/anleitung/07-lokalisierung.md",
    "docs/anleitung/08-ocr-backends.md",
    "docs/anleitung/09-betrieb.md",
    "docs/anleitung/10-kamera-livevorschau.md",
    "docs/anleitung/11-datensatz-sammeln.md",
    { "Rezepte" = "docs/anleitung/rezepte.md" },
    { "Glossar" = "docs/anleitung/glossar.md" },
  ] },
  { "Betrieb und Hardware" = [
    { "Kamera-Inbetriebnahme" = "docs/CAMERA_COMMISSIONING.md" },
    { "Hardwareprofil" = "docs/HARDWARE_PROFILE.md" },
    { "Optischer Aufbau" = "docs/OPTICAL_SETUP.md" },
    { "Displaybus-Abgriff" = "docs/DISPLAYBUS_TAP.md" },
    { "GSVmulti-Protokoll" = "docs/GSVMULTI_PROTOCOL.md" },
    { "Abhängigkeiten" = "docs/dependencies.md" },
  ] },
  { "Messungen" = [
    { "Validierung (Zahlen)" = "docs/VALIDATION.md" },
    { "Zeitverhalten" = "docs/TIMING.md" },
    { "Laborjournal" = "docs/lab_journal.md" },
  ] },
  { "Entscheidungen" = [
    { "Offene Punkte (OQ)" = "docs/open-questions.md" },
    { "Projektgeschichte" = "docs/project_history.md" },
    { "Werkzeugrecherche" = "docs/tool_review_2026-09-08.md" },
  ] },
  { "API-Referenz" = [
    "api/index.md",
    "api/vertraege.md",
    "api/frames.md",
    "api/detect.md",
    "api/geometrie.md",
    "api/ocr.md",
    "api/validate.md",
    "api/sink.md",
    "api/pipeline.md",
    "api/workbench.md",
  ] },
  { "Für Agents" = [
    { "AGENTS.md" = "AGENTS.md" },
    { "CLAUDE.md" = "CLAUDE.md" },
  ] },
]

[project.theme]
language = "de"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Hell"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dunkel"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

# API-Referenz aus den Docstrings. griffe liest den Quelltext statisch, importiert
# also nichts — picamera2, cv2 & Co. muessen in .venv-docs nicht vorhanden sein.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_submodules = true
show_root_heading = true
show_root_full_path = true
show_source = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = false
heading_level = 2
merge_init_into_class = true
show_if_no_docstring = true
filters = ["!^_"]

# Offline-fähig: Links auf .html-Dateien statt Verzeichnis-URLs, die Suche
# funktioniert auch per file://. So taugt dieselbe Seite als ZIP aus Forgejo
# Actions zum lokalen Öffnen und später für ein Hosting.
[project.plugins.offline]
enabled = true
