[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picam-number-ingestion"
version = "0.1.0.dev0"
description = "Optische Displayauslesung von Messverstaerkern (Pi 5 + AI Camera) mit serieller Ausgabe an GSVmulti"
requires-python = ">=3.13"

# ABSICHTLICH LEER. numpy, opencv, pyserial, picamera2 und libcamera kommen
# ausschliesslich als Debian-Systempakete. Stuenden sie hier, installierte pip
# PyPI-Kopien nach .venv/lib/, die die Systempakete ueberschatten - ein
# pip-numpy neben dem gegen System-numpy gebauten cv2 ist ein ABI-Bruch.
# Deshalb: venv mit --system-site-packages, Installation mit --no-deps.
# Siehe docs/dependencies.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Noch keine Konsolenskripte. Ein deklarierter Einsprungpunkt auf ein nicht
# vorhandenes Modul ist schlechter als keiner - er scheitert erst zur Laufzeit.
# Die Kamera-Diagnose liegt bis dahin als scripts/camera-commissioning.sh vor.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: braucht eine angeschlossene Kamera",
    "serial: braucht UART oder Transceiver",
    "slow: laeuft laenger als 5 s",
]
