[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picam-number-ingestion"
dynamic = ["version"]
description = "Optische Displayauslesung von Messverstaerkern (Pi 5 + AI Camera) mit serieller Ausgabe an GSVmulti"
requires-python = ">=3.13"

# ABSICHTLICH LEER. numpy, opencv, pyserial, picamera2 und libcamera kommen
# ausschliesslich als Debian-Systempakete. Stuenden sie hier, installierte pip
# PyPI-Kopien nach .venv/lib/, die die Systempakete ueberschatten - ein
# pip-numpy neben dem gegen System-numpy gebauten cv2 ist ein ABI-Bruch.
# Deshalb: venv mit --system-site-packages, Installation mit --no-deps.
# Siehe docs/dependencies.md.
dependencies = []

[project.optional-dependencies]
# Mit --no-deps installiert pip die Abhaengigkeiten der Dev-Werkzeuge NICHT mit;
# sie stehen explizit in docs/dependencies.md (Abschnitt "Dev-Werkzeuge").
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "bandit>=1.8",
    "ruff>=0.6",
]

[project.scripts]
dispread = "dispread.workbench.cli:main"
picam = "dispread.admin.cli:main"

# Workbench-Pakete werden durch scripts/install-workbench.sh als Debian-Pakete
# installiert; keine pip-Abhaengigkeiten fuer die Kamera-/CV-Systembibliotheken.

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["dispread.data", "dispread.data.*"]

[tool.setuptools.package-data]
"dispread" = ["data/sensors/**/*.json", "data/sensors/**/*.md"]
"dispread.workbench" = ["static/*", "static/vendor/fonts/*", "static/live/*", "static/live/*/*"]
"dispread.sensors" = ["agent_prompt.md"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.bandit]
# Gate: scripts/ci.py ruft bandit mit -ll (medium und hoeher) auf; Bestandsfunde
# stehen in der Baseline, damit nur neue Funde brechen. Installation: .venv-tools
# (scripts/install-security-tools.sh), NICHT in .venv.
exclude_dirs = ["tests", ".worktrees", ".venv", ".venv-tools", "node_modules", "test-results", "var"]

[tool.pytest.ini_options]
# --strict-config macht unbekannte Optionen zu Fehlern. Deshalb steht "timeout"
# (pytest-timeout) und "--cov" (pytest-cov) hier NICHT: beide Plugins sind per
# --no-deps optional. scripts/ci.py setzt --timeout und --cov, wenn das Plugin da ist.
addopts = "-ra --tb=short --strict-markers --strict-config --durations=15"
testpaths = ["tests"]
pythonpath = ["src", "windows/bridge/src"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "hardware: braucht eine angeschlossene Kamera",
    "serial: braucht UART oder Transceiver",
    "slow: laeuft laenger als 5 s",
    "timing: misst Wanduhr-Laufzeit; bei pytest -n uebersprungen, getrennt mit -m timing",
    "perf: Leistungsmessung (Durchsatz/Latenz); laeuft nicht in T0/T1, Gate ueber scripts/perf-report.py",
]
